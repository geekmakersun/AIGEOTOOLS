# ============================================================================
# GEO 智能内容优化平台 · 1Panel / Docker Compose 部署
#
# 使用方式：
#   cd /opt/1panel/www/源代码/AIGEOTOOLS
#   docker compose up -d --build
#
# 二次开发：
#   源码通过 volume 挂载进容器 /app，改宿主上的 .py 直接生效
#   （Streamlit 默认带自动重载；若要强制刷新：docker compose restart）
#
# 敏感配置（API Keys）：
#   方式 A（推荐）：在宿主 .streamlit/ 目录放 secrets.toml，由 volume 自动挂载
#                  .streamlit/secrets.toml 已在 .gitignore，不会进入仓库
#   方式 B：        在 1Panel 容器管理界面的「环境变量」里填，Streamlit 自动识别
#
# ────────────────────────────────────────────────────────────────────────────
# ★ 全部名称通过环境变量 + 默认值变量化，不硬编码：
#
#   变量                          默认值                 说明
#   ────────────────────────────────────────────────────────────────
#   APP_NAME                      geo-tool              compose project name
#   CONTAINER_NAME                ${APP_NAME}           docker container 名称
#   IMAGE                         ${APP_NAME}:latest    镜像 tag
#   APP_PORT_HOST                 28501                 宿主侧端口（OpenResty 反代指向此）
#   APP_PORT_INNER                8501                  容器内 Streamlit 端口
#   NETWORK_NAME                  1panel-network        加入的外部网络名
#   VOLUME_DB                     ${APP_NAME}-db        SQLite 数据卷名
#   VOLUME_KB                     ${APP_NAME}-kb        RAG 知识库卷名
#
#  用法：
#   # 1Panel 面板填变量 → 自动生效
#   # 本地也可用 .env 文件，或命令行临时覆盖：
#   APP_NAME=my-geo CONTAINER_NAME=mygeo APP_PORT_HOST=38501 docker compose up -d
# ============================================================================

# compose project 名
name: ${APP_NAME:-geo-tool}

services:
  # service key 保持硬编码（compose 规范限制：key 必须在解析时确定）
  geoapp:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建时强制用清华 PyPI 镜像
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: ${IMAGE:-${APP_NAME:-geo-tool}:latest}
    # ★ 拉取策略：本地有就复用，没有才去 registry 拉
    #   missing —— 默认值（本地没有才拉）
    #   always  —— 强制拉最新 tag digest，用于 make force-pull
    #   never   —— 只用本地镜像，完全离线
    pull_policy: missing
    # 容器名变量化；默认 = APP_NAME
    container_name: ${CONTAINER_NAME:-${APP_NAME:-geo-tool}}
    restart: unless-stopped
    networks:
      - geo_net
    # 端口也变量化（OpenResty conf 指向宿主机侧端口 APP_PORT_HOST）
    ports:
      - "${APP_PORT_HOST:-28501}:${APP_PORT_INNER:-8501}"
    # 资源限制（项目是 Streamlit UI + LangChain 客户端，不跑模型推理）
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M
    # 环境变量：Streamlit 识别 STREAMLIT_* 前缀自动应用
    # enableXsrfProtection=true —— 生产环境必须开，否则存在 CSRF 风险；
    #   当前反代完全同源（geo-tool-local.13aq.com → 8501）且 8501 未暴露公网，
    #   但 XSRF 是安全底线；enableCORS 保持 false（反代做 CORS 就行）
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_PORT: "${APP_PORT_INNER:-8501}"
    # ========== 卷挂载（持久化 + 源码热替换） ==========
    volumes:
      # 1) 源码目录：容器内 /app 直接用宿主源码 —— 二次开发改 .py 立即生效
      - .:/app:z
      # 2) Streamlit 配置：主题 + 服务参数（公开，可提交仓库）
      - ./.streamlit:/app/.streamlit:ro
      # 3) 数据目录（SQLite + RAG 知识库）：宿主 ./data 已 chown 给
      #    容器内 geoapp (uid=1000)，直接可写，持久化在宿主上
      - ./data:/app/data:z
    # 说明：不再用命名卷挂载 SQLite/KB 到 /app/geo_data.db / knowledge_base，
    #      因为 compose bind mount 覆盖后 geoapp 无法在宿主 root:root 的
    #      /app 目录下创建文件，改成统一走 /app/data（宿主权限已设）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${APP_PORT_INNER:-8501}/_stcore/health').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# （不再需要命名卷定义 —— SQLite + RAG 统一走宿主 ./data bind mount）

networks:
  geo_net:
    external: true
    name: ${NETWORK_NAME:-1panel-network}
